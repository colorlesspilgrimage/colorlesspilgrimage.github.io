<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sam — colorless pilgrimage</title>
    <meta name="description" content="Sam. GitHub, X, and email." />
    <meta name="theme-color" content="#12110e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,550&family=Public+Sans:ital,wght@0,400;0,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      try {
        var saved = localStorage.getItem("pilgrimage-theme");
        var known = ["ink", "paper", "river", "ember", "moss", "dusk"];
        if (saved && known.indexOf(saved) !== -1) {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <nav aria-label="Contact">
        <a href="https://github.com/colorlesspilgrimage">GitHub</a>
        <a href="https://x.com/samatbing">X</a>
        <a href="mailto:samjdhood@gmail.com">Mail</a>
      </nav>
      <div id="theme-list" class="themes"></div>
      <p class="hint">Press <kbd>T</kbd></p>
    </main>
    <script src="/site.js"></script>
  </body>
</html>
